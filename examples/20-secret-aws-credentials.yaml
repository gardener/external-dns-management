apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: default
type: Opaque
data:
  # replace '...' with values encoded as base64
  # see https://docs.aws.amazon.com/general/latest/gr/managing-aws-access-keys.html
  AWS_ACCESS_KEY_ID: ...
  AWS_SECRET_ACCESS_KEY: ...
  # optionally specify the region
  #AWS_REGION: ...
  # optionally specify the token
  #AWS_SESSION_TOKEN: ...

  # Alternatively use Gardener cloud provider credentials convention
  #accessKeyID: ...
  #secretAccessKey: ...
  #region: ...
  #sessionToken: ...

  # Alternatively an external credential provider can be used (AWS default
  # credentials chain). This is only accepted when the operator has set the
  # environment variable ALLOW_AWS_CREDENTIALS_CHAIN=true on the
  # dns-controller-manager. In that case just set this value:
  #AWS_USE_CREDENTIALS_CHAIN: dHJ1ZQ==
