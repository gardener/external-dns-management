# Example Secret containing credentials and cluster configuration for the GDC DNS provider (gdch-dns).
apiVersion: v1
kind: Secret
metadata:
  name: gdc-credentials
  namespace: default
type: Opaque
data:
  # replace '...' with base64 encoded GDC service account key JSON file
  serviceaccount.json: ...
  # replace '...' with base64 encoded GDC org cluster config JSON (orgClusterURL and caData)
  gdch-config: ...
