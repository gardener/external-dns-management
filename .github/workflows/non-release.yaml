name: Build
on:
  push:
    branches:
      - master
      - 'release-v*'
  pull_request:

  pull_request_target:
    types:
      - labeled

jobs:
  build:
    if: ${{ github.repository == 'gardener/external-dns-management' && (github.event_name != 'pull_request_target' || (github.event_name == 'pull_request_target' && github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '')) }}
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  component-descriptor:
    if: ${{ github.repository == 'gardener/external-dns-management' && (github.event_name != 'pull_request_target' || (github.event_name == 'pull_request_target' && github.event.label.name == vars.DEFAULT_LABEL_OK_TO_TEST && vars.DEFAULT_LABEL_OK_TO_TEST != '')) }}
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    needs:
      - build
    permissions:
      id-token: write
      contents: write
