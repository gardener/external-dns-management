name: GDC Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    # Only trigger on PRs that modify GDC-specific provider or integration test files.
    paths:
      - 'pkg/controller/provider/gdc/**'
      - 'pkg/dnsman2/dns/provider/handler/gdc/**'
      - 'examples/*gdc*'
      - 'test/integration/gdc/**'
      - 'scripts/ci-gdc-*.sh'
      - '.github/workflows/gdc-integration-test.yaml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: GDC External DNS Management Integration Test (GDC Staging)
    runs-on: ubuntu-latest
    environment: gdc-staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Sets up Go and registers the built-in Go problem matcher to automatically
      # surface any `go test` failures as GitHub Actions annotations.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Log in to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs ./scripts/ci-gdc-integration-test.sh, which verifies CI preconditions, installs the
      # gdcloud CLI from GDC Staging, packages the shoot-dns-service chart, builds/pushes
      # dns-controller-manager to ghcr.io, runs the GDC integration test suite, and cleans up
      # the temporary ghcr.io image on exit.
      - name: Run GDC Integration Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: GDC External DNS Management Integration Test (GDC Staging)
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/dns-controller-manager
          GDC_DNS_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_DNS_SERVICE_ACCOUNT_KEY }}
        run: make test-integration-gdc
